<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · StudySmartly</title>
  <meta name="description" content="StudySmartly: play games made by me and my friends.">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0e1a">
  <meta name="apple-mobile-web-app-title" content="StudySmartly">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="logo">
        <div class="logo-mark" data-icon="logo"></div>
        <div class="logo-text">Study<span>Smartly</span></div>
      </a>
      <div class="header-actions">
        <form class="search" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="Search game or creator" aria-label="Search games" autocomplete="off">
          <button type="submit" aria-label="Search" data-icon="search"></button>
        </form>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"></button>
        <div id="accountSlot"></div>
      </div>
    </div>
  </header>

  <main class="container profile-page">
    <div id="profileMissing" class="empty hidden" style="margin-top:30px"><div class="big">👤</div><h3>No player with that name</h3>
      <p>They might have changed or deleted their account. <a href="./" style="color:var(--accent);font-weight:700">Back home</a></p></div>

    <div id="profileView" class="hidden">
      <section class="profile-hero">
        <span class="profile-avatar" id="pAvatar"></span>
        <div class="profile-info">
          <h1 id="pName"></h1>
          <div class="profile-badges" id="pBadges"></div>
          <div class="profile-meta" id="pMeta"></div>
        </div>
        <div class="profile-actions" id="pActions"></div>
      </section>

      <div class="profile-stats">
        <div class="pstat"><b id="sMade">0</b><span>Games made</span></div>
        <div class="pstat"><b id="sRevised">0</b><span>Games revised</span></div>
        <div class="pstat"><b id="sLikes">0</b><span>Likes given</span></div>
        <div class="pstat"><b id="sComments">0</b><span>Comments</span></div>
      </div>

      <section id="madeSection" class="home-section">
        <div class="section-head"><span class="section-icon">🎮</span><h2 id="madeTitle">Games made</h2></div>
        <div class="grid" id="madeGrid"></div>
      </section>
      <section id="favSection" class="home-section">
        <div class="section-head"><span class="section-icon">⭐</span><h2>Favourites</h2></div>
        <div class="grid" id="favGrid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> StudySmartly · Made by friends, for friends.</span>
      <a href="admin.html">Admin panel →</a>
    </div>
  </footer>

  <script src="js/profile.js"></script>
</body>
</html>
