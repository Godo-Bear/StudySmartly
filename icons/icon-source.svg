<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="0.55" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#00b8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#5fe3ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#ff6bcb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6bcb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1a0f5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- full-bleed square: phones round the corners themselves -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>
  <!-- sparkle -->
  <path d="M398 92 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" fill="#fff" opacity="0.9"/>
  <circle cx="122" cy="120" r="9" fill="#fff" opacity="0.55"/>
  <!-- game controller -->
  <g filter="url(#shadow)">
    <path fill="url(#pad)" d="M168 176h176c52 0 86 34 96 86l14 72c8 42-16 72-48 72-22 0-36-12-48-30l-18-28H172l-18 28c-12 18-26 30-48 30-32 0-56-30-48-72l14-72c10-52 44-86 96-86z"/>
  </g>
  <!-- d-pad -->
  <rect x="146" y="238" width="24" height="76" rx="7" fill="#6c5ce7"/>
  <rect x="120" y="264" width="76" height="24" rx="7" fill="#6c5ce7"/>
  <!-- buttons -->
  <circle cx="344" cy="248" r="17" fill="#ff4d8d"/>
  <circle cx="384" cy="286" r="17" fill="#00b8ff"/>
  <circle cx="304" cy="286" r="17" fill="#22c55e"/>
  <circle cx="344" cy="324" r="17" fill="#f5a524"/>
  <!-- center -->
  <rect x="226" y="222" width="60" height="14" rx="7" fill="#c9cdf0"/>
</svg>
