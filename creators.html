<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creators · StudySmartly</title>
  <meta name="description" content="StudySmartly: play games made by me and my friends.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="logo">
        <div class="logo-mark" data-icon="logo"></div>
        <div class="logo-text">Study<span>Smartly</span></div>
      </a>
      <div class="header-actions">
        <form class="search" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="Search game or creator" aria-label="Search games" autocomplete="off">
          <button type="submit" aria-label="Search" data-icon="search"></button>
        </form>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"></button>
        <div id="accountSlot"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <div class="crumbs"><a href="./">Home</a> › Creators</div>
        <span class="hero-icon">👥</span>
        <h1>Creators</h1>
        <p>The people making games for StudySmartly. Click someone to see all their games.</p>
      </div>
      <div class="hero-stats">
        <div class="stat"><b id="statCreators">0</b><span>Creators</span></div>
        <div class="stat"><b id="statGames">0</b><span>Games</span></div>
      </div>
    </section>

    <div class="section-head">
      <span data-icon="plus"></span>
      <h2>All creators</h2>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="creator-grid" id="creatorGrid"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> StudySmartly · Made by friends, for friends.</span>
      <a href="admin.html">Admin panel →</a>
    </div>
  </footer>

  <script src="js/creators.js"></script>
</body>
</html>
