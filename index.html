<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudySmartly — Games by Us</title>
  <meta name="description" content="StudySmartly: play games made by me and my friends.">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0e1a">
  <meta name="apple-mobile-web-app-title" content="StudySmartly">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="logo">
        <div class="logo-mark" data-icon="logo"></div>
        <div class="logo-text">Study<span>Smartly</span></div>
      </a>
      <div class="header-actions">
        <form class="search" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="Search game or creator" aria-label="Search games" autocomplete="off">
          <button type="submit" aria-label="Search" data-icon="search"></button>
        </form>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"></button>
        <div id="accountSlot"></div>
      </div>
    </div>
  </header>

  <nav class="category-bar">
    <div class="container chips" id="chips"></div>
  </nav>

  <main class="container">
    <section class="hero" id="hero">
      <div>
        <div class="crumbs hidden" id="crumbs"></div>
        <span class="hero-icon hidden" id="heroIcon"></span>
        <h1 id="heroTitle">Play. Create. Share.</h1>
        <p id="heroText">Games built by our crew — pick one and hit play. Made something cool? Hit <b>＋ Add your game</b> to share it.</p>
      </div>
      <div class="hero-stats">
        <div class="stat"><b id="statGames">0</b><span>Games</span></div>
        <div class="stat"><b id="statCreators">0</b><span>Creators</span></div>
      </div>
    </section>

    <!-- Home: one section per game type -->
    <div id="homeSections" class="hidden"></div>

    <!-- A game type, a creator, or search results -->
    <div id="listView">
      <div class="section-head">
        <span data-icon="plus"></span>
        <h2 id="sectionTitle">Games</h2>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> StudySmartly · Made by friends, for friends.</span>
      <a href="admin.html">Admin panel →</a>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
