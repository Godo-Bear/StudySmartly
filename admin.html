<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudySmartly Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="logo">
        <div class="logo-mark" data-icon="logo"></div>
        <div class="logo-text">Study<span>Smartly</span> <small style="font-family:Nunito;font-size:14px;color:#9aa0c3;font-weight:700">ADMIN</small></div>
      </a>
      <div class="header-actions" style="justify-content:flex-end">
        <a class="btn btn-ghost btn-small" href="./">← Back to site</a>
        <button class="btn btn-ghost btn-small hidden" id="logoutBtn">Log out</button>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </header>

  <!-- Login: the code is checked by the Cloudflare Worker (ADMIN_CODE secret) -->
  <section class="login-wrap" id="loginView">
    <div class="panel">
      <h2>🛡️ Admin unlock</h2>
      <p class="sub">Enter the admin code to add, edit or remove games.</p>
      <form id="loginForm">
        <div class="field">
          <label for="adminCode">Admin code</label>
          <input id="adminCode" type="password" placeholder="••••••••" required autocomplete="current-password" autofocus>
        </div>
        <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:16px">
          <input type="checkbox" id="remember"> Remember me on this device
        </label>
        <button class="btn btn-primary" style="width:100%" type="submit" id="loginBtn">Unlock</button>
      </form>
    </div>
  </section>

  <!-- Dashboard -->
  <main class="container hidden" id="dashView">
    <div class="admin-layout">
      <div class="panel">
        <h2 id="formTitle">Add a game</h2>
        <p class="sub">Paste the link to the game website and who made it.</p>
        <form id="gameForm">
          <div class="field">
            <label for="fName">Game name <span class="req">*</span></label>
            <input id="fName" maxlength="60" required placeholder="e.g. Space Dodge">
          </div>
          <div class="field">
            <label for="fCreator">Creator <span class="req">*</span></label>
            <input id="fCreator" maxlength="60" required placeholder="Who made it?" list="creatorList">
            <datalist id="creatorList"></datalist>
          </div>
          <div class="field">
            <label for="fUrl">Game link <span class="req">*</span></label>
            <input id="fUrl" type="url" required placeholder="https://…">
          </div>
          <div class="field">
            <label for="fCategory">Category</label>
            <input id="fCategory" maxlength="30" placeholder="Action" list="categoryList">
            <datalist id="categoryList"></datalist>
          </div>
          <div class="field">
            <label>Thumbnail <span class="req" id="thumbReq">*</span></label>
            <label class="upload" id="uploadBox">
              <input id="fThumbFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
              <div class="upload-thumb" id="uploadThumb">🖼️</div>
              <div class="upload-text">
                <b id="uploadLabel">Upload a picture</b>
                <span id="uploadHint">PNG, JPG, WebP or GIF · click or drag it here</span>
              </div>
            </label>
          </div>
          <div class="field">
            <label for="fDesc">Description</label>
            <textarea id="fDesc" maxlength="400" placeholder="What's the game about? How do you play?"></textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit" id="saveBtn">Add game</button>
            <button class="btn btn-ghost hidden" type="button" id="cancelEdit">Cancel edit</button>
          </div>
        </form>
        <div class="card preview-card" id="preview"></div>
      </div>

      <div class="panel">
        <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <h2 style="margin:0">All games <span id="gameCount" style="color:var(--muted);font-weight:600"></span></h2>
          <button class="btn btn-ghost btn-small" id="refreshBtn" style="margin-left:auto">↻ Refresh</button>
        </div>
        <p class="sub">Changes go live on the site after Cloudflare redeploys (about a minute).</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th></th><th>Game</th><th>Creator</th><th>Category</th><th></th></tr></thead>
            <tbody id="gameRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
